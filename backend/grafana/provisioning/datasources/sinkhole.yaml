apiVersion: 1

datasources:
  - name: Sinkhole PostgreSQL
    uid: sinkhole-postgres
    type: postgres
    url: 127.0.0.1:5432
    user: grafana_reader
    secureJsonData:
      password: $GF_DATABASE_PASSWORD
    jsonData:
      database: sinkhole
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
    isDefault: true
